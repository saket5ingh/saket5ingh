name: Refresh public profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - '.github/workflows/refresh-profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public profile sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: saket5ingh
        run: python scripts/update_profile.py
      - name: Commit generated content if changed
        run: |
          if git diff --quiet -- README.md assets/activity.svg; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.svg
          git commit -m 'chore: refresh public GitHub profile [skip ci]'
          git push
